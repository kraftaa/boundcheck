name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by full commit SHA (the tag is a comment).
# Dependabot (.github/dependabot.yml) proposes grouped updates.
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: python3 scripts/check_markdown_links.py
      - run: python3 -m json.tool schemas/adapter-v1.schema.json >/dev/null
      - run: python3 -m json.tool schemas/report-v1.schema.json >/dev/null

  real-runtime:
    # One job runs the matrix sequentially to avoid multiplying Actions jobs.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: cargo build --release --locked
      - name: Check pinned runtimes against explicit baselines
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/compat_matrix.py --runtime openai-agents --check-baselines --no-docs
          else
            python3 scripts/compat_matrix.py --check-baselines --no-docs
          fi

  isolation:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker pull python:3.13-slim-trixie@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
      - run: cargo test --locked --test integration docker_isolation -- --nocapture
        env:
          BOUNDARYCHECK_DOCKER_IMAGE: python:3.13-slim-trixie@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f

  audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup run stable cargo install cargo-audit --version 0.22.2 --locked
      - run: rustup run stable cargo audit

  ci-success:
    if: always()
    needs: [test, real-runtime, isolation, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          TEST: ${{ needs.test.result }}
          REAL_RUNTIME: ${{ needs.real-runtime.result }}
          ISOLATION: ${{ needs.isolation.result }}
          AUDIT: ${{ needs.audit.result }}
        run: test "$TEST $REAL_RUNTIME $ISOLATION $AUDIT" = "success success success success"
