name: ci
on: [push, pull_request]
permissions:
  contents: read

# Third-party actions are pinned by full commit SHA (the tag is a comment).
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  real-runtime:
    # OpenAI Agents SDK, installed only from hash-locked requirements.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mode: ["", "--stream"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: cargo build --release --locked
      - run: |
          python -m venv .venv-agents
          .venv-agents/bin/python -m pip install --require-hashes --no-deps \
            -r adapters/openai-agents-python/requirements.lock
          .venv-agents/bin/python -m pip check
      - run: |
          ./target/release/boundarycheck run --adapter openai-agents-python --extended \
            --report boundarycheck-report.json \
            -- .venv-agents/bin/python adapters/openai-agents-python/agent.py ${{ matrix.mode }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --locked
      - run: cargo audit
